name: Attachment extension

on:
  push:
    branches: [main]
    paths:
      - extensions/attachments/**
      - .github/workflows/attachments.yml
  pull_request:
    paths:
      - extensions/attachments/**
      - .github/workflows/attachments.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned image and run all extension tests
        run: docker build --progress=plain -t kb-attachments-test extensions/attachments

  publish:
    name: Publish attachment image to GHCR
    needs: build-and-test
    if: github.repository == 'Pomurnik/obsidian-mcp' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build, test and publish
        uses: docker/build-push-action@v6
        with:
          context: extensions/attachments
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pomurnik/obsidian-mcp:attachments
            ghcr.io/pomurnik/obsidian-mcp:attachments-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pomurnik/obsidian-mcp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Obsidian MCP with guarded attachment move, delete and restore tools
